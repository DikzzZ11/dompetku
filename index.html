<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dompetku – Catatan Keuangan</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14212b;--mute:#6b7a88;--line:#e2e8ee;--acc:#0f7a63;--accsoft:#dcf1ea;--out:#e0522d;--outsoft:#fbe5de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1419;--card:#18222b;--ink:#eaf0f5;--mute:#8b9aa8;--line:#26323d;--acc:#3ccba6;--accsoft:#14382f;--out:#ff7d57;--outsoft:#3a211a}}
:root[data-theme="dark"]{--bg:#0d1419;--card:#18222b;--ink:#eaf0f5;--mute:#8b9aa8;--line:#26323d;--acc:#3ccba6;--accsoft:#14382f;--out:#ff7d57;--outsoft:#3a211a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:30px;margin:8px 0 14px;letter-spacing:-.5px}
.hero{background:var(--acc);color:#fff;border-radius:22px;padding:20px}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{color:#06231c}
.hero small{opacity:.85;font-size:14px}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-1px;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.pill{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}
.pill b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-top:14px}
.card h2{font-size:17px;margin:0 0 10px}
.cat{margin:10px 0}
.cat .t{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--out);border-radius:4px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--outsoft)}
.ic.in{background:var(--accsoft)}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m span{font-size:13px;color:var(--mute)}
.amt{font-weight:600;font-variant-numeric:tabular-nums}
.amt.in{color:var(--acc)}.amt.out{color:var(--out)}
.del{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
nav{display:flex;align-items:center;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 0 6px}
nav button{border:0;background:none;color:var(--mute);font:12px inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;padding:4px}
nav button span{font-size:22px}
nav button.on{color:var(--acc)}
nav .add{width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;margin-top:-26px;min-width:0;justify-content:center;box-shadow:0 4px 14px rgba(15,122,99,.4)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font:600 15px inherit;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:17px inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.amtin{font-size:30px;font-weight:700;text-align:center}
.save{width:100%;margin-top:16px;border:0;background:var(--acc);color:#fff;font:600 17px inherit;padding:14px;border-radius:14px}
.cancel{width:100%;border:0;background:none;color:var(--mute);font:16px inherit;padding:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:14px inherit;white-space:nowrap}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.hide{display:none}
</style>
</head>
<body>
<main id="main"></main>
<nav>
  <button id="t-home" class="on"><span>🏠</span>Beranda</button>
  <button class="add" id="addBtn" aria-label="Catat transaksi">+</button>
  <button id="t-hist"><span>🧾</span>Riwayat</button>
</nav>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="seg"><button id="s-out" class="on">Pengeluaran</button><button id="s-in">Pemasukan</button></div>
    <label for="amt">Jumlah (Rp)</label>
    <input id="amt" class="amtin" inputmode="numeric" placeholder="0">
    <label for="cat">Kategori</label>
    <select id="cat"></select>
    <label for="note">Catatan</label>
    <input id="note" placeholder="Contoh: makan siang">
    <label for="date">Tanggal</label>
    <input id="date" type="date">
    <button class="save" id="save">Simpan transaksi</button>
    <button class="cancel" id="cancel">Batal</button>
  </div>
</div>

<script>
const CATS={out:[["🍜","Makanan"],["🚌","Transportasi"],["🛍️","Belanja"],["💡","Tagihan"],["🎬","Hiburan"],["🏥","Kesehatan"],["📦","Lainnya"]],
            in:[["💼","Gaji"],["🎁","Hadiah"],["📈","Investasi"],["💰","Lainnya"]]};
let tx=[],type="out",tab="home",filter="Semua";
try{tx=JSON.parse(localStorage.getItem("dompetku")||"[]")}catch(e){tx=[]}
if(!tx.length){const d=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
  tx=[{id:1,type:"in",cat:"Gaji",amt:5000000,note:"Gaji bulanan",date:d(2)},{id:2,type:"out",cat:"Makanan",amt:45000,note:"Makan siang",date:d(1)},{id:3,type:"out",cat:"Transportasi",amt:20000,note:"Ojek ke kantor",date:d(1)},{id:4,type:"out",cat:"Tagihan",amt:350000,note:"Listrik",date:d(0)}]}
const $=id=>document.getElementById(id);
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const icon=(t,c)=>(CATS[t].find(x=>x[1]===c)||["💰"])[0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate=s=>new Date(s+"T00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"});
function save(){try{localStorage.setItem("dompetku",JSON.stringify(tx))}catch(e){}}
function sum(a,t){return a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0)}
function row(x){return `<div class="tx"><div class="ic ${x.type}">${icon(x.type,x.cat)}</div><div class="m"><b>${esc(x.note||x.cat)}</b><span>${x.cat} · ${fmtDate(x.date)}</span></div><div class="amt ${x.type}">${x.type==="in"?"+":"−"}${rp(x.amt)}</div><button class="del" data-id="${x.id}" aria-label="Hapus">×</button></div>`}
function render(){
  const sorted=[...tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const ym=new Date().toISOString().slice(0,7), mo=tx.filter(x=>x.date.startsWith(ym));
  let h="";
  if(tab==="home"){
    const bal=sum(tx,"in")-sum(tx,"out"), inc=sum(mo,"in"), exp=sum(mo,"out");
    h=`<h1>Dompetku</h1><div class="hero"><small>Total saldo</small><div class="big">${rp(bal)}</div>
      <div class="row"><div class="pill"><small>Masuk bulan ini</small><b>${rp(inc)}</b></div><div class="pill"><small>Keluar bulan ini</small><b>${rp(exp)}</b></div></div></div>`;
    const by={};mo.filter(x=>x.type==="out").forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
    const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    h+=`<div class="card"><h2>Pengeluaran per kategori</h2>`+(ents.length?ents.map(([c,v])=>`<div class="cat"><div class="t"><span>${icon("out",c)} ${c}</span><b>${rp(v)}</b></div><div class="bar"><i style="width:${v/exp*100}%"></i></div></div>`).join(""):`<div class="empty">Belum ada pengeluaran bulan ini.</div>`)+`</div>`;
    h+=`<div class="card"><h2>Transaksi terbaru</h2>`+(sorted.length?sorted.slice(0,5).map(row).join(""):`<div class="empty">Ketuk + untuk mencatat transaksi pertama.</div>`)+`</div>`;
  }else{
    const all=["Semua","Pemasukan","Pengeluaran"];
    const list=sorted.filter(x=>filter==="Semua"||(filter==="Pemasukan"?x.type==="in":x.type==="out"));
    h=`<h1>Riwayat</h1><div class="chips">${all.map(f=>`<button data-f="${f}" class="${f===filter?"on":""}">${f}</button>`).join("")}</div>
      <div class="card" style="margin-top:0">`+(list.length?list.map(row).join(""):`<div class="empty">Tidak ada transaksi.</div>`)+`</div>`;
  }
  $("main").innerHTML=h;
  $("t-home").classList.toggle("on",tab==="home");$("t-hist").classList.toggle("on",tab==="hist");
}
function setType(t){type=t;$("s-out").classList.toggle("on",t==="out");$("s-in").classList.toggle("on",t==="in");
  $("cat").innerHTML=CATS[t].map(c=>`<option>${c[0]} ${c[1]}</option>`).join("")}
function openSheet(){setType("out");$("amt").value="";$("note").value="";$("date").value=new Date().toISOString().slice(0,10);$("sheet").classList.add("show");setTimeout(()=>$("amt").focus(),50)}
$("addBtn").onclick=openSheet;
$("cancel").onclick=()=>$("sheet").classList.remove("show");
$("s-out").onclick=()=>setType("out");$("s-in").onclick=()=>setType("in");
$("amt").oninput=e=>{const v=e.target.value.replace(/\D/g,"");e.target.value=v?Number(v).toLocaleString("id-ID"):""};
$("save").onclick=()=>{
  const amt=Number($("amt").value.replace(/\D/g,""));
  if(!amt){$("amt").focus();return}
  const cat=$("cat").value.replace(/^\S+\s/,"");
  tx.push({id:Date.now(),type,cat,amt,note:$("note").value.trim(),date:$("date").value||new Date().toISOString().slice(0,10)});
  save();$("sheet").classList.remove("show");render();
};
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("show")};
$("t-home").onclick=()=>{tab="home";render()};
$("t-hist").onclick=()=>{tab="hist";render()};
$("main").onclick=e=>{
  const d=e.target.closest(".del");if(d){tx=tx.filter(x=>x.id!==Number(d.dataset.id));save();render();return}
  const f=e.target.closest("[data-f]");if(f){filter=f.dataset.f;render()}
};
render();
</script>
</body>
</html>
